# ResearchAgent-RL Default Configuration

# Environment settings
environment:
  max_steps: 15
  max_invalid_actions: 3
  max_no_progress: 3

# Corpus settings
corpus:
  corpus_dir: "data/corpus"

# Data settings
data:
  tasks_dir: "data/tasks"

# Output settings
output:
  output_dir: "outputs"
  trajectory_dir: "outputs/trajectories"
  eval_results_dir: "outputs/eval_results"

# Logging settings
logging:
  log_trajectory: true
  log_eval: true

# ResearchAgent-RL

# Core Architecture

## System Overview
ResearchAgent-RL 将科研任务求解建模为有限步长的、document-grounded 的 tool-use MDP。
Agent 通过 SEARCH → READ → RERANK → CITE → ANSWER 动作序列完成推理感知检索、证据积累和引用归因回答。

## Tech Stack
- **Base Model**: Qwen series (MVP: small-scale)
- **SFT**: Hugging Face Transformers + PEFT (LoRA)
- **RL**: veRL + Ray + vLLM
- **Retrieval**: Local chunk library + BM25/embedding
- **Reranker**: Simple first, upgrade later

## Training Stages
1. **Stage 0**: Environment + Mock Tools (validate MDP)
2. **Stage 1**: Rule-based Baseline (generate trajectories)
3. **Stage 2**: SFT Warm Start (Transformers + PEFT)
4. **Stage 3**: RL Post-training (veRL + Ray + vLLM)
5. **Stage 4**: Evaluation + Ablation


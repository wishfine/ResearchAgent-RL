# Slime Environment and Reward configuration for ResearchAgent-RL GRPO training

env:
  max_steps: 10
  corpus_dir: "data/searchqa_debug/corpus"
  tasks_dir: "data/searchqa_debug/tasks"

reward:
  reward_type: "token_f1"      # Primary answer accuracy metric. Options: token_f1, exact_match, contains
  invalid_penalty: 0.05        # Penalty deducted per syntax/parsing error
  step_penalty: 0.01           # Penalty deducted per action step taken to encourage brevity
  citation_weight: 0.20        # Weight contribution (20%) of citation F1 in final score
  base_weight: 0.80            # Weight contribution (80%) of answer accuracy
